name: Desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
          - name: Linux arm64
            os: ubuntu-22.04-arm
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/desktop/bun.lock') }}

      - run: bun install
        working-directory: apps/desktop

      # The app loads the hosted client; Tauri only needs the folder to exist.
      - name: Placeholder frontend
        shell: bash
        run: |
          mkdir -p apps/frontend/dist
          echo '<!doctype html><title>Vanilla</title>' > apps/frontend/dist/index.html

      - uses: tauri-apps/tauri-action@v0
        env:
          VANILLA_URL: ${{ vars.VANILLA_URL }}
          # Builds look for updates in the latest published release (latest.json is uploaded
          # by tauri-action); the public key pairs with the TAURI_SIGNING_PRIVATE_KEY secret.
          VANILLA_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json
          VANILLA_UPDATE_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":true}}'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Vanilla Desktop ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: First version

      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
