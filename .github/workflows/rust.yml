name: Rust

on:
  push:
    branches: [main]
    paths: ["apps/backend/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["apps/backend/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: git ls-files '*.rs' | xargs rustfmt --edition 2024 --check
