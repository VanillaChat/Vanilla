[package]
name = "vanilla-dev"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30.0"
portable-pty = "0.9"
vt100 = "0.15"
notify = "8"
libc = "0.2"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tokio-postgres = "0.7"
redis = { version = "1.0.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
